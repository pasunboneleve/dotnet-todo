<main class="app-shell">
  <section class="todo-panel" aria-labelledby="todo-title">
    <header class="panel-header">
      <p class="eyebrow">In-memory TODO API</p>
      <h1 id="todo-title">TODO List</h1>
    </header>

    <form class="todo-form" (ngSubmit)="addTodo()">
      <label for="new-todo">New item</label>
      <div class="form-row">
        <input
          #newTodoInput
          id="new-todo"
          name="new-todo"
          type="text"
          [(ngModel)]="newTitle"
          placeholder="Add something to do"
          autocomplete="off"
        />
        <button type="submit" [disabled]="!newTitle.trim() || isSaving">
          {{ isSaving ? 'Adding...' : 'Add' }}
        </button>
      </div>
    </form>

    @if (errorMessage) {
      <p class="status error" role="alert">{{ errorMessage }}</p>
    }

    @if (isLoading) {
      <p class="status">Loading todos...</p>
    } @else if (todos.length === 0) {
      <p class="empty-state">No todos yet.</p>
    } @else {
      <ul class="todo-list" aria-label="TODO items">
        @for (todo of todos; track todo.id) {
          <li>
            <span>{{ todo.title }}</span>
            <button
              type="button"
              class="delete-button"
              [disabled]="deletingIds.has(todo.id)"
              (click)="deleteTodo(todo)"
              [attr.aria-label]="'Delete ' + todo.title"
            >
              Delete
            </button>
          </li>
        }
      </ul>
    }
  </section>
</main>
