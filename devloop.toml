root = "."
debounce_ms = 300
state_file = ".devloop/state.json"
startup_workflows = ["startup"]

[watch.source]
paths = [
  "TodoApi/",
  "TodoFrontend/src/",
]
workflow = "source_changed"

[watch.frontend_config]
paths = [
  "package.json",
  "package-lock.json",
  "node_modules/.package-lock.json",
  "TodoFrontend/angular.json",
  "TodoFrontend/package.json",
  "TodoFrontend/package-lock.json",
  "TodoFrontend/tsconfig.json",
  "TodoFrontend/tsconfig.app.json",
  "TodoFrontend/tsconfig.spec.json",
  "TodoFrontend/scripts/",
]
workflow = "frontend_config_changed"

[process.api]
command = ["./scripts/api-watch.sh"]
cwd = "."
autostart = false
restart = "on_failure"
output = { inherit = true, body_style = "plain" }

[process.api.readiness]
kind = "http"
url = "$TODO_API_URL/api/todos"
interval_ms = 500
timeout_ms = 30000

[process.web]
command = ["./scripts/web.sh"]
cwd = "."
autostart = false
restart = "on_failure"
output = { inherit = true, body_style = "plain" }

[process.web.readiness]
kind = "http"
url = "$TODO_WEB_URL/"
interval_ms = 500
timeout_ms = 30000

[process.frontend_tests]
command = ["./scripts/frontend-test-watch.sh"]
cwd = "."
autostart = false
restart = "on_failure"
output = { inherit = true, body_style = "plain" }

[workflow.startup]
steps = [
  { action = "start_process", process = "api" },
  { action = "wait_for_process", process = "api" },
  { action = "start_process", process = "web" },
  { action = "wait_for_process", process = "web" },
  { action = "start_process", process = "frontend_tests" },
  { action = "log", message = "API: $TODO_API_URL/api/todos\nWeb: $TODO_WEB_URL\nTests: Karma ChromeHeadless watch", style = "boxed" },
]

[workflow.source_changed]
steps = [
  { action = "log", message = "Source changed; dotnet watch, ng serve, and Karma own the rebuild/retest cycle.", style = "plain" },
]

[workflow.frontend_config_changed]
steps = [
  { action = "log", message = "Frontend dependencies or build config changed; restarting Angular dev server and Karma watcher.", style = "plain" },
  { action = "restart_process", process = "web" },
  { action = "wait_for_process", process = "web" },
  { action = "restart_process", process = "frontend_tests" },
]
